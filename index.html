<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Evolve GM - A modern and scalable virtual learning platform for NEET and JEE aspirants." />

  <title>Evolve GM</title>
</head>

<body>
  <div id="root"></div>
  <script>
    window.addEventListener('error', function(e) {
      const errDiv = document.createElement('div');
      errDiv.style = 'position:fixed;top:0;left:0;right:0;background:red;color:white;padding:20px;z-index:999999;font-size:16px;white-space:pre-wrap;overflow:auto;max-height:100vh;';
      errDiv.innerText = 'CRASH REPORT: ' + e.message + '\n\n' + (e.error ? e.error.stack : '');
      document.body.appendChild(errDiv);
    });
    window.addEventListener('unhandledrejection', function(e) {
      const errDiv = document.createElement('div');
      errDiv.style = 'position:fixed;top:0;left:0;right:0;background:darkred;color:white;padding:20px;z-index:999999;font-size:16px;white-space:pre-wrap;overflow:auto;max-height:100vh;';
      errDiv.innerText = 'PROMISE CRASH: ' + e.reason;
      document.body.appendChild(errDiv);
    });
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
